<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta property="og:description" content="Books by Tokish J. Médeau, including CHIVEY, THE HIDDEN SUN, and TOMMY.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tokishmedeau.com/books.html">

<style>

body{
    margin:0;
    background:#faf9f7;
    color:#222;
    font-family:Georgia, "Times New Roman", serif;
}

main{
    max-width:1200px;
    margin:auto;
    padding:70px 30px 100px;
}

.back{
    display:inline-block;
    margin-bottom:60px;
    color:#444;
    text-decoration:none;
    font-size:18px;
}

.back:hover{
    text-decoration:underline;
}

.books{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:45px;
    align-items:start;
}

.book{
    position:relative;
    display:block;
    text-decoration:none;
    color:#222;
}

.cover{
    position:relative;
    overflow:hidden;
    background:#eee;
}

.cover img{
    width:100%;
    height:auto;
    display:block;
    transition:opacity .25s ease;
}

.description{
    position:absolute;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:35px;
    box-sizing:border-box;

    background:rgba(250,249,247,.94);
    color:#222;

    font-size:21px;
    line-height:1.6;
    text-align:center;

    opacity:0;
    transition:opacity .25s ease;
}

.book:hover .description{
    opacity:1;
}

.book:hover .cover img{
    opacity:.25;
}

.book-title{
    margin-top:18px;
    text-align:center;
    font-size:24px;
    letter-spacing:.5px;
}

footer{
    margin-top:120px;
    padding-top:35px;
    border-top:1px solid #ddd;
    text-align:center;
    color:#777;
}

@media (max-width:800px){

    .books{
        grid-template-columns:1fr 1fr;
        gap:30px;
    }

}

@media (max-width:550px){

    main{
        padding:45px 20px 80px;
    }

    .books{
        grid-template-columns:1fr;
        max-width:420px;
        margin:auto;
    }

    .description{
        font-size:20px;
    }

}

</style>

</head>

<body>
