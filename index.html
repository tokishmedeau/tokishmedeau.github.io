<style>

html, body {
    margin: 0;
    padding: 0;
    background: #f6eddb;
    color: #222;
    font-family: 'EB Garamond', serif;
    text-align: center;
    overflow-x: hidden;
}

/* ---------- MAIN CONTAINER ---------- */

main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 60px;
}

/* ---------- HEADER IMAGE ---------- */

.hero {
    width: 100%;
    max-width: 1400px;
    height: auto;
    display: block;
    margin: 0 auto;
}

/* ---------- TEXT ---------- */

h1 {
    font-family: 'Playball', cursive;
    font-size: clamp(65px, 7.5vw, 130px);
    font-weight: 400;
    margin: -45px 0 10px;
    color: #222;
    position: relative;
    z-index: 2;
}

h2 {
    margin: 14px 0 18px;
    font-size: clamp(20px, 2.2vw, 32px);
    font-weight: 400;
    color: #222;
    letter-spacing: clamp(4px, 0.6vw, 9px);
}

.tagline {
    margin-bottom: 45px;
    font-size: clamp(17px, 1.8vw, 27px);
    color: #333;
    letter-spacing: 2.5px;
}

/* ---------- BUTTONS ---------- */

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin: 35px 0 65px;
}

.button {
    display: inline-block;
    min-width: clamp(150px, 15vw, 220px);
    padding: 14px 28px;

    font-size: clamp(14px, 1.2vw, 18px);
    letter-spacing: 2px;
    text-transform: uppercase;

    text-align: center;
    text-decoration: none;

    color: #222;
    background: #f6eddb;

    border: 1px solid #444;
    border-radius: 2px;

    transition: .2s;
}

.button:hover {
    background: #222;
    color: #faf9f7;
}

/* Primary button */

.button-primary {
    background: #7b2c32;
    color: #faf9f7;
    border-color: #7b2c32;
}

.button-primary:hover {
    background: #5f2025;
    border-color: #5f2025;
}

/* ---------- FOOTER ---------- */

footer {
    text-align: center;
    padding: 20px 0 40px;
}

footer p {
    font-size: clamp(12px, 1vw, 15px);
    color: #666;
    letter-spacing: 2px;
    margin: 0;
}

/* ---------- MOBILE (SMARTPHONES ONLY) ---------- */

@media (max-width: 650px) {

    main {
        padding: 0 10px 30px;
    }

    .hero {
        width: 280%;
        max-width: none;
        margin-left: -60%;
        margin-bottom: -5px;
    }

    h1 {
        font-size: 52px;
        white-space: nowrap;
        margin: -10px 0 6px;
    }

    h2 {
        font-size: 18px;
        letter-spacing: 4px;
        margin: 0 0 6px;
    }

    .tagline {
        font-size: 17px;
        margin-bottom: 28px;
        letter-spacing: 2px;
    }

    .buttons {
        gap: 12px;
        margin: 20px 0 40px;
    }

    .button {
        min-width: 110px;
        padding: 10px 18px;
        font-size: 16px;
        letter-spacing: 1.5px;
    }

    footer p {
        font-size: 12px;
        letter-spacing: 1px;
    }

}

</style>
