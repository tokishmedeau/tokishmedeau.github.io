.hero{

}

@media (max-width: 600px) {

    }
}

h1 {

.buttons{

    margin:35px 0 85px;

.button{

    display:inline-block;
    width:135px;
    margin:6px;

    font-size:18px;
    letter-spacing:.3px;

    text-align:center;
    text-decoration:none;

    color:#222;
    background:#f6eddb;

    border:1px solid #444;
    border-radius:2px;

    transition:.2s;

}

.button:hover{

    background:#222;
    color:#faf9f7;

}

.button-primary{

    background:#7b2c32;
    color:#faf9f7;
    border-color:#7b2c32;
